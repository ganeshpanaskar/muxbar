<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Muxbar concept 09: Card Shuffle, colourway C8 Midnight Glow. A deck of session panes; the front session is dealt away and the next one slides forward.
       Animation: one shuffle every 2 s (hold 1.2 s, move 0.6 s); status dots cycle working/waiting/idle over 6 s. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A2E37"/>
      <stop offset="0.5" stop-color="#14161B"/>
      <stop offset="1" stop-color="#060709"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="card" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.30"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="3"/>

  <!-- incoming back card (only visible during the shuffle) -->
  <g transform="translate(512,425) scale(0.82)" opacity="0" filter="url(#card)">
    <animateTransform attributeName="transform" type="translate" values="512 395;512 395;512 425;512 425" keyTimes="0;0.6;0.9;1" calcMode="spline" keySplines="0 0 1 1;0.45 0 0.2 1;0 0 1 1" dur="2s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="scale" additive="sum" values="0.74;0.74;0.82;0.82" keyTimes="0;0.6;0.9;1" calcMode="spline" keySplines="0 0 1 1;0.45 0 0.2 1;0 0 1 1" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.6;0.9;1" calcMode="spline" keySplines="0 0 1 1;0.45 0 0.2 1;0 0 1 1" dur="2s" repeatCount="indefinite"/>
    <rect x="-260" y="-190" width="520" height="380" rx="48" fill="#3A404B" stroke="#4A5261" stroke-width="3"/>
    <circle cx="-212" cy="-150" r="16" fill="#3BE37F">
      <animate attributeName="fill" values="#3BE37F;#FFC53D;#7A8494" calcMode="discrete" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>
  <!-- back card -->
  <g transform="translate(512,425) scale(0.82)" filter="url(#card)">
    <animateTransform attributeName="transform" type="translate" values="512 425;512 425;512 485;512 485" keyTimes="0;0.6;0.9;1" calcMode="spline" keySplines="0 0 1 1;0.45 0 0.2 1;0 0 1 1" dur="2s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="scale" additive="sum" values="0.82;0.82;0.91;0.91" keyTimes="0;0.6;0.9;1" calcMode="spline" keySplines="0 0 1 1;0.45 0 0.2 1;0 0 1 1" dur="2s" repeatCount="indefinite"/>
    <rect x="-260" y="-190" width="520" height="380" rx="48" fill="#3A404B" stroke="#4A5261" stroke-width="3">
      <animate attributeName="fill" values="#3A404B;#3A404B;#2A2F38;#2A2F38" keyTimes="0;0.6;0.9;1" dur="2s" repeatCount="indefinite"/>
    </rect>
    <circle cx="-212" cy="-150" r="16" fill="#7A8494">
      <animate attributeName="fill" values="#7A8494;#3BE37F;#FFC53D" calcMode="discrete" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>
  <!-- middle card -->
  <g transform="translate(512,485) scale(0.91)" filter="url(#card)">
    <animateTransform attributeName="transform" type="translate" values="512 485;512 485;512 565;512 565" keyTimes="0;0.6;0.9;1" calcMode="spline" keySplines="0 0 1 1;0.45 0 0.2 1;0 0 1 1" dur="2s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="scale" additive="sum" values="0.91;0.91;1;1" keyTimes="0;0.6;0.9;1" calcMode="spline" keySplines="0 0 1 1;0.45 0 0.2 1;0 0 1 1" dur="2s" repeatCount="indefinite"/>
    <rect x="-260" y="-190" width="520" height="380" rx="48" fill="#2A2F38" stroke="#4A5261" stroke-width="3">
      <animate attributeName="fill" values="#2A2F38;#2A2F38;#1C2027;#1C2027" keyTimes="0;0.6;0.9;1" dur="2s" repeatCount="indefinite"/>
    </rect>
    <circle cx="-212" cy="-150" r="16" fill="#FFC53D">
      <animate attributeName="fill" values="#FFC53D;#7A8494;#3BE37F" calcMode="discrete" dur="6s" repeatCount="indefinite"/>
    </circle>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.6;0.9;1" dur="2s" repeatCount="indefinite"/>
      <rect x="-176" y="-158" width="110" height="16" rx="8" fill="#2E343E"/>
      <polyline points="-196,-62 -146,-22 -196,18" fill="none" stroke="#3EE6F5" stroke-opacity="0.75" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
      <polyline points="-196,-62 -146,-22 -196,18" fill="none" stroke="#3EE6F5" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="-114" y="-50" width="42" height="58" rx="7" fill="#3EE6F5"/>
      <rect x="-196" y="66" width="300" height="22" rx="11" fill="#2A3039"/>
      <rect x="-196" y="110" width="210" height="22" rx="11" fill="#2A3039"/>
    </g>
  </g>
  <!-- front card -->
  <g transform="translate(512,565)" filter="url(#card)">
    <animateTransform attributeName="transform" type="translate" values="512 565;512 565;512 665;512 665" keyTimes="0;0.6;0.9;1" calcMode="spline" keySplines="0 0 1 1;0.45 0 0.2 1;0 0 1 1" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.6;0.85;1" calcMode="spline" keySplines="0 0 1 1;0.45 0 0.2 1;0 0 1 1" dur="2s" repeatCount="indefinite"/>
    <rect x="-260" y="-190" width="520" height="380" rx="48" fill="#1C2027" stroke="#4A5261" stroke-width="3"/>
    <circle cx="-212" cy="-150" r="16" fill="#3BE37F">
      <animate attributeName="fill" values="#3BE37F;#FFC53D;#7A8494" calcMode="discrete" dur="6s" repeatCount="indefinite"/>
    </circle>
    <rect x="-176" y="-158" width="110" height="16" rx="8" fill="#2E343E"/>
    <polyline points="-196,-62 -146,-22 -196,18" fill="none" stroke="#3EE6F5" stroke-opacity="0.75" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
      <polyline points="-196,-62 -146,-22 -196,18" fill="none" stroke="#3EE6F5" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="-114" y="-50" width="42" height="58" rx="7" fill="#3EE6F5">
      <animate attributeName="opacity" values="1;0;1" keyTimes="0;0.5;1" calcMode="discrete" dur="1s" repeatCount="indefinite"/>
    </rect>
    <rect x="-196" y="66" width="300" height="22" rx="11" fill="#2A3039"/>
    <rect x="-196" y="110" width="210" height="22" rx="11" fill="#2A3039"/>
  </g>
</svg>
