name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install tmux
        run: brew install tmux
      - name: Build
        run: swift build -c release --product Muxbar
      - name: Test
        run: swift test
